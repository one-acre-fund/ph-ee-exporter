---
name: ph-ee-exporter
run-name: ph-ee-exporter-${{ github.ref_name }}-${{ github.run_number }}

"on":
  push:
    branches:
      - main
      - develop
      - release/*
      - hotfix/*
    paths-ignore:
      - "catalog-info.yaml"

  pull_request:
    branches:
      - main
      - develop
      - release/*
      - hotfix/*
    paths-ignore:
      - "catalog-info.yaml"

env:
  SHOULD_PUBLISH: ${{ (github.ref  == 'refs/heads/main' ||  github.ref == 'refs/heads/develop' || startsWith(github.ref , 'refs/heads/release') || startsWith(github.ref, 'refs/heads/hotfix')) && github.event_name != 'schedule' }}
  REGISTRY_PROVIDER: ${{ vars.REGISTRY_PROVIDER != '' && vars.REGISTRY_PROVIDER || 'ecr' }}
  IMAGE_REPOSITORY: oneacrefund/ph-ee-kafka-exporter

jobs:
  Build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      PH_KAFKA_EXPORTER_IMAGE_TAG: ${{ steps.set-image-tag.outputs.IMAGE_TAG }}
    steps:
      - name: Check out source code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java Version
        uses: actions/setup-java@v4.7.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Get Revision
        run: echo "REVISION=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Get Revision and Set Image Tag
        id: set-image-tag
        run: |
          VERSION_TAG=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          echo "VERSION_TAG=$VERSION_TAG"

          IMAGE_TAG="${VERSION_TAG}.$(date '+%Y.%m.%d').${{ github.run_number }}"
          echo "IMAGE_SEMANTIC_HASH=$IMAGE_TAG"
          echo "Tags: $IMAGE_TAG"

          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_SEMANTIC_HASH=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Maven build
        run: |
          mvn -B verify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.REGISTRY_PROVIDER == 'ecr' }}
        with:
          role-to-assume: ${{ vars.ECR_REGISTRY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.REGISTRY_PROVIDER == 'ecr' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.REGISTRY_PROVIDER == 'ecr' }}
        run: |
          if aws ecr describe-repositories --repository-names "${{ env.IMAGE_REPOSITORY }}" >/dev/null 2>&1; then
            echo "ECR repository '${{ env.IMAGE_REPOSITORY }}' already exists"
          else
            echo "Creating ECR repository '${{ env.IMAGE_REPOSITORY }}'..."
            aws ecr create-repository \
              --repository-name "${{ env.IMAGE_REPOSITORY }}" \
              --image-scanning-configuration scanOnPush=true
          fi

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3.5.0
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.REGISTRY_PROVIDER == 'acr' }}
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_PULL_USERNAME }}
          password: ${{ secrets.ACR_PULL_PASSWORD }}

      - name: Build Docker image
        run: |
          if [[ "${{ env.SHOULD_PUBLISH }}" != 'true' ]]; then
            IMAGE="${{ env.IMAGE_REPOSITORY }}"
          elif [[ "${{ env.REGISTRY_PROVIDER }}" == 'ecr' ]]; then
            IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_REPOSITORY }}"
          else
            IMAGE="${{ vars.ACR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}"
          fi
          docker build . -t "${IMAGE}:${{ steps.set-image-tag.outputs.IMAGE_TAG }}"

      - name: Push image to Amazon ECR
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.REGISTRY_PROVIDER == 'ecr' }}
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.IMAGE_REPOSITORY }}"
          TAG="${{ steps.set-image-tag.outputs.IMAGE_TAG }}"
          docker push "${IMAGE}:${TAG}"
          docker tag "${IMAGE}:${TAG}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

      - name: Push image to Azure Container Registry
        if: ${{ env.SHOULD_PUBLISH == 'true' && env.REGISTRY_PROVIDER == 'acr' }}
        run: |
          docker push ${{ vars.ACR_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.set-image-tag.outputs.IMAGE_TAG }}
