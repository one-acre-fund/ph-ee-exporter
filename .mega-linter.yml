---
# MegaLinter configuration, see https://megalinter.io/configuration/
# Only linters whose findings this codebase acts on. Checkstyle, PMD, cspell and jscpd
# with stock rules report hundreds of findings on the inherited upstream code.

ENABLE_LINTERS:
  - REPOSITORY_GITLEAKS
  - REPOSITORY_SECRETLINT
  - REPOSITORY_TRUFFLEHOG
  - YAML_YAMLLINT
  - MARKDOWN_MARKDOWNLINT

SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
PRINT_ALPACA: false
